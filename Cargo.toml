[package]
name = "openworkers-runtime-jsc"
version = "0.14.0"
edition = "2024"

[dependencies]
# Common types
# openworkers-core = { path = "../openworkers-core", features = ["testing"] }
openworkers-core = { git = "https://github.com/openworkers/openworkers-core", tag = "v0.14.0" }

# JSCore runtime (using local fork)
rusty_jsc = { git = "https://github.com/wasmerio/rusty_jsc", rev = "1a6f72bf4f3c423f8cd3e7d91e121a0c0ad50af7" }
rusty_jsc_macros = { git = "https://github.com/wasmerio/rusty_jsc", rev = "1a6f72bf4f3c423f8cd3e7d91e121a0c0ad50af7" }

# Async runtime
tokio = { version = "1.43", features = ["full"] }
futures = "0.3"

# Signal handling (for timeouts and graceful termination)
signal-hook = "0.3"
signal-hook-tokio = { version = "0.3", features = ["futures-v0_3"] }

# Logging
log = "0.4"
env_logger = "0.11"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP
bytes = { version = "1.11", features = ["serde"] }
tokio-stream = "0.1"

# URL parsing (WHATWG)
url = "2.5"

# Crypto
ring = "0.17"
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
# ESM to classic script lowering for the SSR benchmark fixture
openworkers-transform = { git = "https://github.com/openworkers/openworkers-transform" }
