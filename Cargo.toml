[package]
name = "openworkers-runtime-jsc"
version = "0.18.1"
edition = "2024"

[features]
default = ["system"]
# BindingType::Invoke: env.<NAME>.invoke(command, args) calls a function of the host
invoke = ["openworkers-core/invoke"]
# JavaScriptCore.framework of macOS
system = ["openworkers-jsc/system"]

[dependencies]
# Common types
# openworkers-core = { path = "../openworkers-core", features = ["testing"] }
openworkers-core = { git = "https://github.com/openworkers/openworkers-core", tag = "v0.18.1" }

# JavaScriptCore
openworkers-jsc = { git = "https://github.com/openworkers/openworkers-jsc", tag = "v0.1.0", default-features = false }

# Async runtime
tokio = { version = "1.43", features = ["full"] }

# Thread CPU clock
libc = "0.2"

# Logging
log = "0.4"
env_logger = "0.11"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP
bytes = { version = "1.11", features = ["serde"] }

# URL parsing (WHATWG)
url = "2.5"

# Crypto
ring = "0.17"
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
# ESM to classic script lowering for the SSR benchmark fixture
openworkers-transform = { git = "https://github.com/openworkers/openworkers-transform" }
